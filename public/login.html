<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - LopClient Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #180d2e 0%, #07050c 65%);
    color: #f5f3ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #100d1a;
    border: 1px solid #251d3a;
    border-radius: 16px;
    padding: 30px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 28px rgba(168, 85, 247, 0.12);
  }
  .brand-icon {
    width: 46px;
    height: 46px;
    margin: 0 auto 14px;
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(217, 70, 239, 0.22));
    border: 1px solid rgba(192, 132, 252, 0.45);
    color: #e9d5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(168, 85, 247, 0.25);
  }
  .card h1 {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 6px;
    text-align: center;
    background: linear-gradient(90deg, #ffffff 0%, #e9d5ff 50%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card p { font-size: 13px; color: #988fb3; text-align: center; margin-bottom: 22px; line-height: 1.45; }
  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 7px; color: #c4b5fd; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #251d3a;
    background: #07050c;
    color: #f5f3ff;
    font-size: 18px;
    letter-spacing: 0.25em;
    text-align: center;
    margin-bottom: 16px;
  }
  input[type="password"]:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.18); }
  .btn-primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed 0%, #a855f7 55%, #d946ef 100%);
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
  }
  .btn-primary:hover { opacity: 0.94; }
  .msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
  .msg.error { color: #fb7185; }
  .msg.ok { color: #34d399; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 id="titleText">LopClient Dashboard</h1>
    <p id="subText">Memeriksa keamanan panel...</p>
    <form id="loginForm">
      <label for="pin" id="pinLabel">PIN Panel (4-8 Digit)</label>
      <input type="password" id="pin" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="••••" required>
      <button type="submit" class="btn-primary" id="submitBtn">Masuk</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const titleText = document.getElementById('titleText');
    const subText = document.getElementById('subText');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    (async () => {
      try {
        const res = await fetch('/api/pin/status');
        const { hasPin } = await res.json();
        if (!hasPin) {
          titleText.textContent = 'Buat PIN Dashboard';
          subText.textContent = 'Atur PIN pribadi (4-8 angka) untuk mengamankan panel lokal Anda. Gratis langsung digunakan.';
          submitBtn.textContent = 'Simpan PIN & Masuk (Free)';
        } else {
          titleText.textContent = 'LopClient Dashboard';
          subText.textContent = 'Masukkan PIN pribadi Anda untuk membuka panel kontrol.';
          submitBtn.textContent = 'Buka Panel';
        }
      } catch {
        subText.textContent = 'Masukkan PIN pribadi Anda';
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = document.getElementById('pin').value.trim();
      msg.textContent = 'Memproses...';
      msg.className = 'msg';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();
        if (data.success) {
          msg.textContent = data.created ? 'PIN tersimpan! Mengalihkan...' : 'Berhasil masuk...';
          msg.className = 'msg ok';
          window.location.href = '/dashboard.html';
        } else {
          msg.textContent = data.error || 'PIN tidak valid';
          msg.className = 'msg error';
        }
      } catch {
        msg.textContent = 'Gagal terhubung ke server';
        msg.className = 'msg error';
      }
    });
  </script>
  <div id="lop-version-badge" style="position:fixed;bottom:10px;right:12px;z-index:9999;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;font-family:monospace;background:rgba(15,23,42,0.78);color:#94a3b8;border:1px solid rgba(148,163,184,0.25);backdrop-filter:blur(6px);pointer-events:none;">LopClient <span id="lop-app-version">v1.0.25</span></div>
</body>
</html>
